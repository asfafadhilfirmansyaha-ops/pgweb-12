<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGIS PGWEB 11</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }

      .legenda {
        max-height: 56vh;
        max-width: min(260px, 65vw);
        overflow: auto;
        padding: 8px 10px;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 1px 5px #0005;
        font:
          13px/1.4 Inter,
          system-ui,
          sans-serif;
      }

      .legenda-bagian:not([hidden]) ~ .legenda-bagian:not([hidden]) {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid #e1e5e8;
      }

      .legenda-simbol {
        max-height: 12vh;
        overflow: auto;
        margin-top: 4px;
      }

      .legenda-kecamatan .legenda-simbol {
        max-height: 24vh;
      }

      .legenda img {
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="map"
      aria-label="Peta sebaran data sekolah di Bandung dan layer pendukung"
    ></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const wmsUrl = "http://localhost:8080/geoserver/wms";

      // Pusat tampilan diarahkan ke lokasi data sekolah di Bandung.
      const map = L.map("map").setView([-6.93169, 107.63729], 16);

      const osm = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          zIndex: 1,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        },
      ).addTo(map);

      const sekolahBandung = {
        judul: "Data Sekolah Bandung",
        nama: "pgweb11:data_sekolah_bandung",
        zIndex: 5,
      };
      const titik = { judul: "Titik", nama: "pgweb11:Titik", zIndex: 4 };
      const jalan = { judul: "Jalan", nama: "pgweb11:Jalan", zIndex: 3 };
      const batasKecamatan = {
        judul: "Batas Kecamatan",
        nama: "pgweb11:BatasKecamatan",
        zIndex: 2,
      };
      const daftarLayer = [sekolahBandung, titik, jalan, batasKecamatan];
      const overlayPeta = {};

      // zIndex menjaga layer titik dan jalan tetap berada di atas poligon.
      for (const item of daftarLayer) {
        item.layer = L.tileLayer
          .wms(wmsUrl, {
            layers: item.nama,
            version: "1.1.1",
            format: "image/png",
            transparent: true,
            maxZoom: 19,
            zIndex: item.zIndex,
          })
          .addTo(map);
        overlayPeta[item.judul] = item.layer;
      }

      L.control
        .layers({ OpenStreetMap: osm }, overlayPeta, {
          collapsed: false,
          autoZIndex: false,
        })
        .addTo(map);

      L.control
        .scale({
          position: "bottomright",
          metric: true,
          imperial: false,
        })
        .addTo(map);

      const bagianLegenda = new Map();
      const legenda = L.control({ position: "bottomleft" });

      legenda.onAdd = function () {
        const kotak = L.DomUtil.create("section", "legenda");
        kotak.setAttribute("aria-label", "Legenda peta");

        for (const item of daftarLayer) {
          const bagian = L.DomUtil.create("div", "legenda-bagian", kotak);
          if (item === batasKecamatan) {
            bagian.classList.add("legenda-kecamatan");
          }
          L.DomUtil.create("strong", "", bagian).textContent = item.judul;

          const parameterLegenda = new URLSearchParams({
            service: "WMS",
            version: "1.1.1",
            request: "GetLegendGraphic",
            format: "image/png",
            layer: item.nama,
          });

          const simbol = L.DomUtil.create("div", "legenda-simbol", bagian);
          const gambar = L.DomUtil.create("img", "", simbol);
          gambar.src = wmsUrl + "?" + parameterLegenda.toString();
          gambar.alt = "Simbologi " + item.judul.toLowerCase();
          bagianLegenda.set(item.layer, bagian);
        }

        L.DomEvent.disableClickPropagation(kotak);
        L.DomEvent.disableScrollPropagation(kotak);
        return kotak;
      };

      function perbaruiLegenda() {
        for (const [layer, bagian] of bagianLegenda) {
          bagian.hidden = !map.hasLayer(layer);
        }
        legenda.getContainer().hidden = [...bagianLegenda.values()].every(
          (bagian) => bagian.hidden,
        );
      }

      legenda.addTo(map);
      map.on("overlayadd overlayremove", perbaruiLegenda);
      perbaruiLegenda();
    </script>
  </body>
</html>
